name: Build and push
run-name: Build and push ${{ github.ref_name }}
on:
  push:
    branches:
      - "*"
permissions:
  contents: read
env:
  CONTAINER_REGISTRY_SERVER: ${{ vars.CONTAINER_REGISTRY_SERVER }}
  CONTAINER_REGISTRY_NAMESPACE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}
  IMAGE_NAME: roles-data
  ENVS: ${{ vars.ENVS }}
jobs:
  build:
    if: |
      startsWith(github.event.head_commit.message, '[')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Set image version
        id: version
        run: echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set environment
        id: environment
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          if [[ $COMMIT_MESSAGE =~ ^\[($ENVS)\] ]]; then
            echo "environment=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "error: invalid env and/or version part"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.CONTAINER_REGISTRY_SERVER }}/${{ vars.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.environment.outputs.environment }}-${{ steps.version.outputs.version }}
            ${{ vars.CONTAINER_REGISTRY_SERVER }}/${{ vars.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.environment.outputs.environment }}-latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
