[project]
name = "roles.data.gouv.fr"
version = "0.1.0"
description = "Gestion des rôles dans le pôle DATA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "databases[postgresql]>=0.9.0",
    "databases>=0.9.0",
    "fastapi[standard]>=0.165.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlmodel>=0.0.50",
    "pydantic-settings>=2.16.3",
    "pydantic>=2.14.4",
    "pyjwt>=2.15.1",
    "passlib[bcrypt]>=1.9.5",
    "sentry-sdk>=3.0.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "authlib>=1.9.10",
    "itsdangerous>=2.2.0",
    "fastapi-mail>=1.6.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=line", "--disable-warnings"]

[tool.ruff.lint]
# Keep ruff's historical default rules (ruff >= 0.16 enables a much larger set by default)
select = ["E4", "E7", "E9", "F"]
